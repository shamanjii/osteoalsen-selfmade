<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Admin - Osteopathie Alsen</title>

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- Custom styling -->
  <style>
    :root {
      --primary-color: #1a202c;
      --secondary-color: #4a5568;
    }

    .nc-appHeader-button {
      background-color: var(--primary-color) !important;
    }

    .nc-appHeader-button:hover {
      background-color: var(--secondary-color) !important;
    }
  </style>
</head>
<body>
  <!-- A little help text during the loading screen -->
  <script>
    CMS.registerPreviewTemplate('blog', ({ entry, widgetFor, widgetsFor }) => {
      const title = entry.getIn(['data', 'title']);
      const excerpt = entry.getIn(['data', 'excerpt']);
      const date = entry.getIn(['data', 'date']);
      const body = widgetFor('body');

      return `
        <div style="padding: 20px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
          <h1 style="color: #1a202c; font-size: 2rem; margin-bottom: 0.5rem;">${title}</h1>
          <p style="color: #666; font-size: 1.1rem; margin-bottom: 1rem;">${excerpt}</p>
          <small style="color: #999;">Veröffentlicht am: ${date}</small>
          <hr style="margin: 2rem 0; border: none; border-top: 1px solid #eee;">
          <div style="line-height: 1.6; color: #333;">${body}</div>
        </div>
      `;
    });
  </script>

  <!-- Netlify Identity redirects -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
