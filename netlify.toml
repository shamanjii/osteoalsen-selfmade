[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables for production
[context.production.environment]
  NEXTAUTH_URL = "https://osteoalsen.de"
  NEXTAUTH_SECRET = "production-secret-256-bit-key-change-this-in-netlify-ui"
  DATABASE_URL = "file:./prod.db"

# Force all admin routes to use Edge Functions
[[edge_functions]]
  function = "admin-router"
  path = "/admin/*"

[[edge_functions]]
  function = "api-router"
  path = "/api/*"

# Identity für Authentifizierung
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Media Upload Configuration
[[redirects]]
  from = "/api/media/*"
  to = "/.netlify/functions/media/:splat"
  status = 200