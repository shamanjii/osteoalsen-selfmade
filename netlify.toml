[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Redirect admin and API routes to CMS subdomain
[[redirects]]
  from = "/admin/*"
  to = "https://cms.osteoalsen.de/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://cms.osteoalsen.de/api/:splat"
  status = 301
  force = true

# Security headers for static site
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"

# Static file optimization
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"