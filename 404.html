<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seite nicht gefunden | Osteopathie Alsen</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="blog/assets/css/style.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .error-page h1 {
      font-size: 6rem;
      color: #1a202c;
      margin-bottom: 0.5rem;
    }
    .error-page p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #4b5563;
    }
    .error-page a {
      display: inline-block;
      margin: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      background: #059669;
      color: white;
      transition: background 0.2s;
    }
    .error-page a:hover {
      background: #047857;
    }
  </style>
</head>
<body>
  <main class="error-page" role="main">
    <h1>404</h1>
    <p>Die Seite, die Sie aufrufen wollten, existiert leider nicht (mehr).</p>
    <a href="/">Zur Startseite</a>
    <a href="/blog/">Zum Blog</a>
